name: Release

# Bump MARKETING_VERSION, commit, then:  git tag v1.9 && git push origin v1.9
# Builds the signed + notarized macOS DMG and Linux tarballs (x86_64, aarch64) and publishes the GitHub release.
# Re-run for an existing tag via "Run workflow" (assets are replaced).
# Without the macOS signing secrets the DMG is skipped and the release is published as a pre-release (Linux only),
# so `releases/latest` (Mac update check, website download button) keeps pointing at the last release with a DMG.
# Re-running once the secrets exist adds the DMG and promotes the release to latest.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CONFIG_SWIFT                 full contents of BetterMSFile/Config.swift
#   MACOS_CERTIFICATE_P12        base64 of the "Developer ID Application" certificate + private key (.p12)
#   MACOS_CERTIFICATE_PASSWORD   password of that .p12
#   ASC_API_KEY_P8               base64 of an App Store Connect API key (.p8, Admin role)
#   ASC_API_KEY_ID               its Key ID
#   ASC_API_ISSUER_ID            its Issuer ID

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and (re)publish, e.g. v1.9
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Ubuntu 26.04: adwaita-swift needs GTK >= 4.20 / libadwaita >= 1.8.
    container: swift:6.4-resolute
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install GTK / libadwaita
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libadwaita-1-dev libgtk-4-dev libsqlite3-dev pkg-config patchelf
      # Reuse dependency clones between runs (faster, fewer network fetches).
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build/repositories
            .build/checkouts
            ~/.cache/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-
      - name: Write Config.swift
        env:
          CONFIG_SWIFT: ${{ secrets.CONFIG_SWIFT }}
        run: |
          [ -n "$CONFIG_SWIFT" ] || { echo "::error::Secret CONFIG_SWIFT is not set"; exit 1; }
          printf '%s\n' "$CONFIG_SWIFT" > BetterMSFile/Config.swift
      - name: Build and package
        run: ./scripts/package-linux.sh "$TAG"
      - name: Smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | "build/BetterMSFile-$TAG-linux-${{ matrix.arch }}/bettermsfile" --mcp | grep -q '"list_locations"'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.ASC_API_KEY_P8 != '' }}
    steps:
      - name: Signing secrets missing, skipping DMG
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::macOS signing secrets not set; publishing without a DMG (pre-release)."
      - uses: actions/checkout@v4
        if: env.HAS_SIGNING == 'true'
        with:
          ref: ${{ env.TAG }}
      - name: Show Xcode
        if: env.HAS_SIGNING == 'true'
        run: xcodebuild -version # runner default (needs >= 26.2 for the macOS 26.2 deployment target)
      - name: Write Config.swift
        if: env.HAS_SIGNING == 'true'
        env:
          CONFIG_SWIFT: ${{ secrets.CONFIG_SWIFT }}
        run: |
          [ -n "$CONFIG_SWIFT" ] || { echo "::error::Secret CONFIG_SWIFT is not set"; exit 1; }
          printf '%s\n' "$CONFIG_SWIFT" > BetterMSFile/Config.swift
      - name: Check tag matches MARKETING_VERSION
        if: env.HAS_SIGNING == 'true'
        run: |
          VERSION=$(xcodebuild -project BetterMSFile.xcodeproj -scheme BetterMSFile -showBuildSettings 2>/dev/null \
            | awk '/ MARKETING_VERSION =/ && !v {v=$3} END {print v}')
          [ "v$VERSION" = "$TAG" ] || { echo "::error::Tag $TAG does not match MARKETING_VERSION $VERSION"; exit 1; }
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$MACOS_CERTIFICATE_P12" ] || { echo "::error::Secret MACOS_CERTIFICATE_P12 is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Write App Store Connect API key
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          [ -n "$ASC_API_KEY_P8" ] || { echo "::error::Secret ASC_API_KEY_P8 is not set"; exit 1; }
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize DMG
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: ./scripts/release.sh --dmg-only
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: macos
          path: build/BetterMSFile-*.dmg
          if-no-files-found: error
      - name: Clean up signing material
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    name: Publish release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # No DMG yet (macOS signing skipped) -> pre-release, so the Mac update check and website keep the last DMG.
          if ls dist/*.dmg >/dev/null 2>&1; then STATUS=(--prerelease=false --latest); else STATUS=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" "${STATUS[@]}"
          else
            gh release create "$TAG" dist/* --title "BetterMSFile $TAG" --generate-notes --verify-tag "${STATUS[@]}"
          fi
