name: Deploy Docs

on:
  push:
    branches: ["main"]

env:
  TARGET: Meta
  TARGET_LINK: meta
  SUBDOMAIN: meta

jobs:
  publish:
    runs-on: linux-docs
    steps:
      - uses: actions/checkout@v7
      - name: Build Docs
        run: |
            ~/tools/swift/swift package --allow-writing-to-directory ./docs generate-documentation \
            --target ${{ env.TARGET }}  \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path "/"
      - name: Modify Docs
        run: |
          echo "<script>window.location.href += \"/documentation/${{ env.TARGET_LINK }}\"</script><p>Please enable JavaScript to view the documentation <a href='/documentation/${{ env.TARGET_LINK }}'>here</a>.</p>" > docs/index.html;
          sed -i 's/,2px/,10px/g' docs/css/index.*.css
      - name: Upload
        uses: https://github.com/wangyucode/sftp-upload-action@v3.0.0
        with:
          host: 'volans.uberspace.de'
          username: 'akforum'
          password: ${{ secrets.password }}
          localDir: 'docs'
          remoteDir: '/var/www/virtual/akforum/${{ env.SUBDOMAIN }}.aparoksha.dev/'
          removeExtraFilesOnServer: true