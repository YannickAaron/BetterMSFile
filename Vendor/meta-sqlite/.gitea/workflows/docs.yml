name: Deploy Docs

on:
  push:
    branches: ["main"]

jobs:
  publish:
    runs-on: david-macbook
    steps:
      - uses: actions/checkout@v4
      - name: Build Docs
        run: |
          xcrun xcodebuild docbuild \
            -scheme MetaSQLite \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$PWD/.derivedData" \
            -skipPackagePluginValidation
          xcrun docc process-archive transform-for-static-hosting \
            "$PWD/.derivedData/Build/Products/Debug/MetaSQLite.doccarchive" \
            --output-path "docs" \
            --hosting-base-path "/"
      - name: Modify Docs
        run: |
          echo "<script>window.location.href += \"/documentation/metasqlite\"</script><p>Please enable JavaScript to view the documentation <a href='/documentation/metasqlite'>here</a>.</p>" > docs/index.html;
          sed -i '' 's/,2px/,10px/g' docs/css/index.*.css
      - name: Upload
        uses: wangyucode/sftp-upload-action@v2.0.2
        with:
          host: 'volans.uberspace.de'
          username: 'akforum'
          password: ${{ secrets.password }}
          localDir: 'docs'
          remoteDir: '/var/www/virtual/akforum/meta-sqlite.aparoksha.dev/'